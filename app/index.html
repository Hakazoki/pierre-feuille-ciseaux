<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Shifumi - Rock-Paper-Scissors</title>
    <meta name="description"
        content="Shifumi Game : Rock - Paper - Scissors. Challenge the computer in this simple and fun game">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <link rel="stylesheet" href="./css/style.css">
</head>

<body class="bg-light text-dark">

    <nav class="navbar navbar-dark bg-dark px-4">
        <a class="navbar-brand d-flex align-items-center" href="#">
            <i class="fa-solid fa-hand-fist me-2"></i> Shifumi
        </a>
    </nav>

    <div class="container text-center mt-5">

        <h1 class="mb-4">Rock - Paper - Scissors</h1>

        <p class="lead">Choose a move to face the computer :</p>

        <div class="d-flex justify-content-center gap-4 mt-4">

            <button class="btn btn-primary p-4 choice" data-choice="pierre">
                <i class="fa-solid fa-hand-fist fa-2x"></i><br>Rock
            </button>

            <button class="btn btn-success p-4 choice" data-choice="feuille">
                <i class="fa-solid fa-hand fa-2x"></i><br>Paper
            </button>

            <button class="btn btn-danger p-4 choice" data-choice="ciseaux">
                <i class="fa-solid fa-hand-scissors fa-2x"></i><br>Scissors
            </button>

        </div>

        <div class="mt-5">
            <h3>Result :</h3>
            <p id="resultat" class="fs-4 fw-bold"></p>

            <h4>Score</h4>
            <p>Player : <span id="scoreJoueur">**</span> | Computer : <span id="scoreOrdi">**</span></p>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>


</body>

</html>
